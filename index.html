<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06070a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LS Studio">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Garage Studio et Armurerie tactique interactifs.">
  <title>LS Studio — Garage · Armurerie</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/app.css">
  <style>html,body{background:#06070a}</style>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}</script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">


    <!-- ================= 1 · ATELIER GARAGE ================= -->
    <section id="view-garage" class="view garage" data-view="garage" aria-label="Atelier Garage">
      <header class="g-top">
        <div class="picker" id="car-picker" role="tablist" aria-label="Choix du véhicule"></div>
      </header>

      <div class="studio" id="studio">
        <div class="studio-mark" id="studio-mark" aria-hidden="true"></div>
        <canvas class="stage-3d" id="stage-3d" role="img" aria-label="Véhicule sélectionné, vue 3D orientable"></canvas>
        <div class="loader" id="g-loader" aria-hidden="true"><i></i><span>Chargement 3D</span></div>
        <p class="no-3d-msg">Vue 3D indisponible sur cet appareil (WebGL désactivé).</p>
        <div class="studio-hud">
          <div class="car-title">
            <span class="brand" id="car-brand"></span>
            <h2 id="car-name"></h2>
            <span class="gen" id="car-gen"></span>
          </div>
          <div class="hud-right"><span class="counter" id="car-counter"></span></div>
        </div>
        <div class="badges" id="badges"></div>
        <div class="dots" id="dots"></div>
        <div class="hint" id="hint">↻ glisser pour tourner · pincer pour zoomer</div>
        <div class="audio-warn glass" id="audio-warn">Son indisponible sur ce navigateur</div>
        <button class="restore glass" id="restore" type="button">︿ Commandes</button>
      </div>

      <div class="deck" id="deck">
        <div class="engine-bar">
          <div class="tach glass" id="tach" aria-label="Compte-tours"></div>
          <button class="btn-start" id="btn-start" type="button" aria-pressed="false"><span><b>START</b><small>ENGINE</small></span></button>
          <button class="btn-gas glass" id="btn-gas" type="button" disabled>
            <span class="fill" id="gas-fill"></span>
            <span class="lbl"><b>Coup de gaz</b><small>Maintenir · tapoter</small></span>
            <span class="pedal" aria-hidden="true"></span>
          </button>
        </div>
        <div class="custom">
          <div class="seg glass" id="seg" role="tablist" aria-label="Personnalisation">
            <button type="button" role="tab" data-seg="paint">Teinte</button>
            <button type="button" role="tab" data-seg="finish">Vernis</button>
            <button type="button" role="tab" data-seg="rims">Jantes</button>
            <button type="button" role="tab" data-seg="glass">Vitres</button>
            <button type="button" role="tab" data-seg="workshop">Feux · Atelier</button>
          </div>
          <div class="rail" id="rail"></div>
        </div>
      </div>
      <div class="sheet-space"></div>
      <div class="tab-space"></div>

      <aside class="sheet" id="sheet" aria-label="Fiche technique">
        <div class="sheet-head" role="button" tabindex="0" aria-expanded="false">
          <div class="grip"></div>
          <div class="row">
            <h3>Fiche technique</h3>
            <span class="sum" id="sheet-sum"></span>
            <span class="chev" aria-hidden="true">︿</span>
          </div>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </aside>
    </section>

    <!-- ================= 2 · ARMURERIE TACTIQUE ================= -->
    <section id="view-armory" class="view armory" data-view="armory" aria-label="Armurerie tactique">
      <header class="g-top">
        <div class="picker" id="a-picker" role="tablist" aria-label="Choix de l'arme"></div>
      </header>

      <div class="studio studio-armory" id="a-studio">
        <div class="studio-mark" id="a-mark" aria-hidden="true"></div>
        <svg class="stage" id="stage-arm" role="img" aria-label="Arme sélectionnée"></svg>
        <div class="studio-hud">
          <div class="car-title">
            <span class="brand" id="a-maker"></span>
            <h2 id="a-name"></h2>
            <span class="gen" id="a-variant"></span>
          </div>
          <div class="hud-right"><span class="counter" id="a-counter"></span></div>
        </div>
        <div class="badges" id="a-badges"></div>
        <div class="dots" id="a-dots"></div>
        <button class="restore glass" id="a-restore" type="button">︿ Commandes</button>
      </div>

      <div class="deck" id="a-deck">
        <div class="grid items-center gap-2 h-[74px] grid-cols-[100px_66px_minmax(0,1fr)]">
          <div class="target glass" id="a-target" role="button" aria-label="Cible — toucher pour effacer"></div>
          <button class="btn-fire" id="a-fire" type="button" aria-label="Tirer"><span><b>FIRE</b><small>TIRER</small></span></button>
          <div class="grid grid-rows-2 gap-1.5 h-full min-w-0">
            <div class="grid grid-cols-[minmax(0,1fr)_auto] gap-1.5 min-w-0">
              <div class="ammo glass" id="a-ammo" aria-live="polite"></div>
              <button class="mode-btn glass" id="a-mode" type="button" aria-label="Sélecteur de tir"><small>SÉL.</small><b>SEMI</b></button>
            </div>
            <button class="reload-btn glass" id="a-reload" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
              Recharger
            </button>
          </div>
        </div>
        <div class="custom">
          <div class="seg glass" id="a-seg" role="tablist" aria-label="Accessoires"></div>
          <div class="rail" id="a-rail"></div>
        </div>
      </div>
      <div class="sheet-space"></div>
      <div class="tab-space"></div>

      <aside class="sheet" id="a-sheet" aria-label="Fiche balistique">
        <div class="sheet-head" role="button" tabindex="0" aria-expanded="false">
          <div class="grip"></div>
          <div class="row">
            <h3>Fiche balistique</h3>
            <span class="sum" id="a-sum"></span>
            <span class="chev" aria-hidden="true">︿</span>
          </div>
        </div>
        <div class="sheet-body" id="a-sheet-body"></div>
      </aside>
    </section>

    <!-- ================= Navigation ================= -->
    <nav class="tabbar glass" role="tablist" aria-label="Navigation">
      <button class="tab" type="button" role="tab" data-tab="garage" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16v-3l2.5-5h11L20 13v3z"/><path d="M3 13h17"/><circle cx="7" cy="16.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/></svg>
        <span>Garage</span>
      </button>
      <button class="tab" type="button" role="tab" data-tab="armory" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span>Armurerie</span>
      </button>
    </nav>
  </div>
</body>
</html>
